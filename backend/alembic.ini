# Alembic configuration -- run every command from the backend/ folder:
#   alembic upgrade head
# NOTE: this file is intentionally ASCII-only. Alembic reads alembic.ini with the
# machine's locale encoding, so Thai comments here would crash on a non-UTF-8
# console. Thai explanations live in alembic/env.py instead.
# There is no sqlalchemy.url here on purpose: the real URL comes from DATABASE_URL
# via app/database.py (see alembic/env.py), so no DB password ever lands in the repo.
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Migration filenames are prefixed with the creation date so they sort chronologically
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
